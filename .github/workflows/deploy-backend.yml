name: Deploy Backend to aaPanel

on:
  push:
    branches:
      - backend
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  deploy:
    name: Deploy Backend via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: false
          script: |
            echo "========================================="
            echo "🚀 MEMULAI DEPLOYMENT BACKEND DI AAPANEL"
            echo "========================================="

            # 1. Load environment profile
            if [ -f /etc/profile ]; then . /etc/profile 2>/dev/null || true; fi
            if [ -f ~/.bashrc ]; then . ~/.bashrc 2>/dev/null || true; fi
            if [ -f ~/.bash_profile ]; then . ~/.bash_profile 2>/dev/null || true; fi
            if [ -f "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh" 2>/dev/null || true; fi
            if [ -f "/www/server/nvm/nvm.sh" ]; then . "/www/server/nvm/nvm.sh" 2>/dev/null || true; fi

            # Tambahkan path Node.js aaPanel secara eksplisit ke PATH
            for dir in /www/server/nodejs/v*/bin /www/server/nvm/versions/node/v*/bin /root/.nvm/versions/node/v*/bin /usr/local/bin /usr/bin; do
              if [ -d "$dir" ]; then
                export PATH="$dir:$PATH"
              fi
            done

            echo "📍 Node Path: $(which node 2>/dev/null || echo 'Not Found')"
            echo "📍 Node Version: $(node -v 2>/dev/null || echo 'Not Found')"
            echo "📍 NPM Version: $(npm -v 2>/dev/null || echo 'Not Found')"

            # 2. Masuk ke direktori project
            TARGET_DIR="${{ secrets.PROJECT_PATH }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/www/wwwroot/backend-saps/be-saps"
            fi

            echo "📁 Masuk ke folder: $TARGET_DIR"
            cd "$TARGET_DIR" || { echo "❌ Direktori $TARGET_DIR tidak ditemukan!"; exit 1; }

            # 3. Tarik update terbaru dari branch backend
            echo "📥 Mengambil kode terbaru dari GitHub (branch: backend)..."
            git fetch origin backend
            git reset --hard origin/backend

            # 4. Install dependencies (termasuk typescript & prisma untuk build)
            echo "📦 Menginstall dependencies (npm install)..."
            npm install --include=dev || npm install

            # 5. Generate Prisma Client
            echo "🗄️ Menjalankan npx prisma generate..."
            npx prisma generate

            # 6. Jalankan migrasi database
            echo "🔄 Menjalankan migrasi database..."
            npx prisma migrate deploy || echo "⚠️ Warning migrasi dilewati..."

            # 7. Build TypeScript ke dist/
            echo "⚙️ Melakukan build TypeScript (npm run build)..."
            npm run build || echo "⚠️ Build gagal atau dilewati, menggunakan pre-built dist/ dari repo"

            # 8. Restart aplikasi dengan PM2
            echo "🔄 Merestart aplikasi di PM2..."
            APP_NAME="${{ secrets.PM2_APP_NAME }}"
            if [ -z "$APP_NAME" ]; then
              APP_NAME="be-saps"
            fi

            # Cari binary PM2
            PM2_BIN="pm2"
            if ! command -v pm2 >/dev/null 2>&1; then
              NODE_DIR=$(dirname "$(which node 2>/dev/null)")
              if [ -f "$NODE_DIR/pm2" ]; then
                PM2_BIN="$NODE_DIR/pm2"
              else
                PM2_BIN="npx pm2"
              fi
            fi

            echo "Menggunakan PM2: $PM2_BIN"
            $PM2_BIN reload "$APP_NAME" --update-env || $PM2_BIN restart "$APP_NAME" --update-env || { echo "❌ Proses PM2 '$APP_NAME' tidak ditemukan"; exit 1; }

            echo "========================================="
            echo "✅ DEPLOYMENT SELESAI & BERHASIL!"
            echo "========================================="
